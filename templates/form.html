<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pontanart</title>
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>pontanart</h1>
        <form action="/options" method="post" enctype="multipart/form-data">
            <fieldset>
                <label for="image" class="custom-file-upload">Choose Image</label>
                <input type="file" name="image" id="image" accept="image/*" required>
                
                <label for="docname">Document name</label>
                <input type="text" name="docname" id="docname" required>
                
                <label for="mode">Mode</label>
                <select name="mode" id="mode">
                    <option value="visual">Visual</option>
                    <option value="linear">Linear</option>
                    <option value="fixed">Fixed</option>
                </select>
                
                <label class="checkbox-label">
                    Adaptive
                    <input type="checkbox" name="adaptive">
                </label>
                
                <label for="characters">Characters</label>
                <input type="text" name="characters" id="characters"
                placeholder="By default, all printable characters are used">
                
                <label for="font_size">Font size</label>
                <input type="number" name="font_size" id="font_size" placeholder="3">
                
                <label for="row_length">Row length</label>
                <input type="number" name="row_length" id="row_length" placeholder="250">
                
                <label for="row_spacing">Row spacing</label>
                <input type="number" name="row_spacing" id="row_spacing" placeholder="60">
                
                <input type="submit" value="Create" class="button">
            </fieldset>
        </form>
    </div>     
    <script src="./static/js/app.js"></script>
</body>
</html>
